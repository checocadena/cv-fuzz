<h1>CV Fuzz is installed</h1>
<p>To load it in Ableton Live:</p>
<ol>
  <li>Open Settings, then Plug-Ins.</li>
  <li>Turn on Use Audio Units v2 and Use VST3 Plug-In System Folders.</li>
  <li>Click Rescan, then find Checo Cadena &gt; CV Fuzz under Plug-Ins.</li>
</ol>
