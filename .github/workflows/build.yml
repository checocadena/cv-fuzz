# Builds CV Fuzz on GitHub's Mac machines so you don't need Xcode locally.
# Push this repo to GitHub, open the Actions tab, and download "CV-Fuzz-macOS".
name: Build CV Fuzz

on:
  push:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build AU, VST3 and Standalone
        run: cmake --build build --config Release --target CVFuzz_AU CVFuzz_VST3 CVFuzz_Standalone -- -quiet

      - name: Validate the Audio Unit
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "build/CVFuzz_artefacts/Release/AU/CV Fuzz.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          auval -v aufx Cvf1 Chca

      - name: Build installer
        run: bash installer/make-installer.sh build/CVFuzz_artefacts/Release

      - uses: actions/upload-artifact@v4
        with:
          name: CV-Fuzz-Installer
          path: dist/*.pkg
