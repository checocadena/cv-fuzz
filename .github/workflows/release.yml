# Builds the Windows installer and Linux package and attaches them to a GitHub release.
# Publish a release on GitHub (with your signed macOS .pkg attached), and this adds
# CV-Fuzz-Windows-Setup.exe and CV-Fuzz-Linux-x64.tar.gz to it automatically.
name: Release builds

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

env:
  WEBVIEW2_VERSION: 1.0.1901.177

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Get the WebView2 SDK
        shell: pwsh
        run: |
          $dir = "C:\webview2\Microsoft.Web.WebView2.$env:WEBVIEW2_VERSION"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Invoke-WebRequest "https://www.nuget.org/api/v2/package/Microsoft.Web.WebView2/$env:WEBVIEW2_VERSION" -OutFile "$env:TEMP\webview2.zip"
          Expand-Archive "$env:TEMP\webview2.zip" -DestinationPath $dir -Force

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DJUCE_WEBVIEW2_PACKAGE_LOCATION=C:/webview2

      - name: Build VST3 and Standalone
        run: cmake --build build --config Release --target CVFuzz_VST3 CVFuzz_Standalone --parallel

      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $ver = (Select-String -Path CMakeLists.txt -Pattern 'project\(CVFuzz VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$ver" "/DArtDir=$pwd\build\CVFuzz_artefacts\Release" installer\windows\cvfuzz.iss

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/CV-Fuzz-Windows-Setup.exe

  linux:
    runs-on: ubuntu-22.04   # older base = runs on more distributions
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libjack-jackd2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev libglu1-mesa-dev libcurl4-openssl-dev

      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target CVFuzz_VST3 CVFuzz_Standalone

      - name: Package
        run: |
          mkdir -p "pkg/CV Fuzz" dist
          cp -R "build/CVFuzz_artefacts/Release/VST3/CV Fuzz.vst3" "pkg/CV Fuzz/"
          cp "build/CVFuzz_artefacts/Release/Standalone/CV Fuzz" "pkg/CV Fuzz/"
          cp installer/linux/install.sh "pkg/CV Fuzz/"
          tar -C pkg -czf dist/CV-Fuzz-Linux-x64.tar.gz "CV Fuzz"

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/CV-Fuzz-Linux-x64.tar.gz

  attach:
    if: github.event_name == 'release'
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            out/CV-Fuzz-Windows-Setup.exe
            out/CV-Fuzz-Linux-x64.tar.gz
