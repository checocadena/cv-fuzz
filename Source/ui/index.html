<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>CV Fuzz, Checo Cadena</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --black: #000; --white: #fff; --gray: #8c8c8c; --rule: #333;
    --display: "Big Shoulders Display", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
    --body: "Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif;
    --rail: 200px;
    --cols: var(--rail) repeat(4, 1fr);
    --ease: cubic-bezier(0.65, 0, 0.25, 1);
    box-sizing: border-box;
  }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { height: 100%; margin: 0; }
  body { background: #1e1e1e; font-family: var(--body); color: var(--white); display: grid; place-items: center; overflow: hidden;
    padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px); -webkit-font-smoothing: antialiased; }
  button { font-family: inherit; }
  :focus-visible { outline: 2px solid var(--white); outline-offset: 2px; }
  #bar :focus-visible, #deck :focus-visible { outline-color: var(--black); }
  a { color: inherit; }

  #frame { width: 1000px; height: 620px; transform-origin: center center; }
  #win { width: 1000px; height: 620px; background: var(--black); display: grid; grid-template-rows: 50px 40px 1fr 140px;
    overflow: hidden; box-shadow: 0 0 0 1px #444, 0 30px 80px rgba(0,0,0,0.6); user-select: none; }

  /* menu bar */
  #bar { background: var(--white); color: var(--black); display: grid; grid-template-columns: var(--rail) 1fr var(--rail); align-items: center; padding: 0 16px; }
  .wordmark { font-family: var(--display); font-weight: 900; font-size: 32px; line-height: 1; letter-spacing: 0.01em; }
  .browser { display: flex; justify-content: center; gap: 6px; }
  .browser .step { width: 30px; height: 30px; border: 1.5px solid var(--black); background: var(--white); font-size: 12px; cursor: pointer; }
  .browser .step:hover { background: var(--black); color: var(--white); }
  .browser select { appearance: none; -webkit-appearance: none; width: 300px; height: 30px; border: 1.5px solid var(--black);
    background: var(--black); color: var(--white); font: 600 13px var(--body); padding: 0 30px 0 10px; cursor: pointer;
    background-image: linear-gradient(45deg, transparent 50%, #fff 50%), linear-gradient(135deg, #fff 50%, transparent 50%);
    background-position: calc(100% - 16px) 13px, calc(100% - 11px) 13px; background-size: 5px 5px; background-repeat: no-repeat; }
  #printBtn { justify-self: end; font: 600 12.5px var(--body); color: var(--black); background: none; border: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }

  /* tabs, left to right, aligned with the deck below */
  #tabs { display: grid; grid-template-columns: var(--cols); position: relative; border-bottom: 1px solid var(--rule); }
  #tabs button { background: none; border: 0; color: var(--gray); cursor: pointer; font: 600 13.5px var(--body); transition: color 0.2s; }
  #tabs button:hover, #tabs button.on { color: var(--white); }
  #tabs button:first-child { border-right: 1px solid var(--rule); }
  #ind { position: absolute; bottom: -1px; height: 3px; background: var(--white); transition: left 0.4s var(--ease), width 0.4s var(--ease); }

  /* stage: rail + overview panel + entry display */
  #stage { display: flex; min-height: 0; overflow: hidden; position: relative; }
  #rail { width: var(--rail); flex: none; border-right: 1px solid var(--rule); padding: 16px 16px 14px; display: flex; flex-direction: column; gap: 10px; overflow: hidden; }
  .id img { width: 72px; height: 72px; border-radius: 50%; object-fit: cover; display: block; margin-bottom: 8px; }
  .id h1 { font-family: var(--display); font-weight: 900; font-size: 38px; line-height: 0.9; margin: 0; }
  .applying { font-size: 12px; color: var(--gray); line-height: 1.4; margin: 0; }
  .skills { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 5px; font-size: 12px; line-height: 1.35; color: #d0d0d0; }
  .skills b { display: block; color: var(--white); font-weight: 600; }
  .contact { margin-top: auto; display: flex; flex-direction: column; gap: 2px; font-size: 12px; }
  .contact a { text-underline-offset: 3px; }
  .contact span { color: var(--gray); }

  #ov { flex: none; width: 800px; overflow: hidden; transition: width 0.55s var(--ease), opacity 0.35s ease; }
  #ov .inner { width: 800px; height: 100%; padding: 14px 24px 12px; display: grid; grid-template-rows: 1fr auto; gap: 10px; }
  .ov-cols { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
  .sk { padding: 3px 0 4px; } .sk b { display: block; font-size: 13.5px; font-weight: 600; line-height: 1.25; } .sk span { display: block; font-size: 12px; color: var(--gray); line-height: 1.35; }
  .ov h3 { font-family: var(--display); font-weight: 800; font-size: 21px; margin: 0 0 4px; padding-bottom: 4px; border-bottom: 1px solid var(--rule); }
  .row { display: block; width: 100%; text-align: left; background: none; border: 0; color: inherit; cursor: pointer; padding: 3px 0 4px; font-family: var(--body); }
  .row .t { display: block; font-size: 13.5px; font-weight: 600; line-height: 1.25; }
  .row .o { display: block; font-size: 12px; color: var(--gray); line-height: 1.35; }
  .row:hover .t { text-decoration: underline; text-underline-offset: 3px; }
  .ov-proj { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
  .ov-proj .row { border-top: 3px solid var(--white); padding-top: 6px; }
  .ov-proj { align-items: start; } .row { display: flex; flex-direction: column; justify-content: flex-start; }
  .ov .hint { font-size: 12px; color: var(--gray); margin: 8px 0 0; }

  #display { flex: 1; min-width: 0; position: relative; padding: 16px 24px 12px; overflow: hidden; transition: opacity 0.35s ease 0.15s; }
  body.ov-mode #display { opacity: 0; pointer-events: none; transition-delay: 0s; }
  body.entry-mode #ov { width: 0; opacity: 0; }
  #panes { position: absolute; left: 24px; top: 16px; width: 752px; bottom: 44px; }
  .pane { position: absolute; inset: 0; transition: transform 0.55s var(--ease), opacity 0.45s ease; will-change: transform; }
  .pane.from-r { transform: translateX(105%); opacity: 0; }
  .pane.from-l { transform: translateX(-105%); opacity: 0; }
  .pane.to-l { transform: translateX(-105%); opacity: 0; }
  .pane.to-r { transform: translateX(105%); opacity: 0; }
  .e-top { display: flex; justify-content: space-between; align-items: center; }
  .tag { font-size: 11.5px; font-weight: 600; border: 1px solid var(--white); padding: 1px 7px; }
  .dates { font-family: var(--display); font-weight: 800; font-size: 22px; }
  .e-body { display: grid; grid-template-columns: 1fr; gap: 20px; margin-top: 4px; }
  .e-body.hasfigs { grid-template-columns: 1fr 230px; }
  .e-body h2 { font-family: var(--display); font-weight: 900; font-size: 42px; line-height: 0.95; margin: 0 0 4px; }
  .org { color: var(--gray); font-size: 14px; margin: 0 0 8px; }
  .what { font-size: 16px; line-height: 1.4; margin: 0 0 10px; max-width: 62ch; }
  .facts { display: grid; grid-template-columns: 76px 1fr; gap: 5px 12px; margin: 0; font-size: 13.5px; line-height: 1.4; }
  .facts dt { color: var(--gray); } .facts dd { margin: 0; }
  .links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .links a, .links button { font: 600 12.5px var(--body); color: var(--black); background: var(--white); border: 0; padding: 5px 10px; text-decoration: none; cursor: pointer; }
  .links a:hover, .links button:hover { background: #cfcfcf; }
  .blot { width: 96px; height: 96px; display: block; border: 1px solid var(--rule); }
  .efigs { display: flex; flex-direction: column; gap: 8px; }
  .efigs figure { margin: 0; background: var(--white); color: var(--black); }
  .efigs img { width: 100%; height: 96px; object-fit: contain; display: block; padding: 5px 5px 0; }
  .efigs figcaption { font-size: 11px; padding: 2px 8px 4px; }
  .timeline { position: absolute; left: 24px; width: 752px; bottom: 10px; display: flex; gap: 4px; }
  .timeline button { flex: 1; min-width: 0; background: none; border: 0; padding: 7px 0 0; cursor: pointer; color: var(--gray); font: 600 11.5px var(--body); text-align: left; position: relative; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .timeline button::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 3px; background: var(--rule); transition: background 0.2s; }
  .timeline button.on { color: var(--white); } .timeline button.on::before { background: var(--white); }

  /* deck: listen cell + four knobs */
  #deck { background: var(--white); color: var(--black); display: grid; grid-template-columns: var(--cols); align-items: center; }
  #listen { margin: 0 12px; height: 116px; border: 0; cursor: default; display: flex; flex-direction: column; padding: 8px 8px 0; border-radius: 10px;
    background: #000; }
  #listen .screen { position: relative; flex: 1; border-radius: 6px; overflow: hidden; background: radial-gradient(ellipse at 50% 50%, #0d0d0d 0%, #000 80%);
    box-shadow: inset 0 0 14px rgba(0,0,0,1), inset 0 0 0 1px #000, 0 1px 0 rgba(255,255,255,0.12); }
  #scope { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #listen .grat { position: absolute; inset: 0; pointer-events: none;
    background-image: linear-gradient(rgba(255,255,255,0.18), rgba(255,255,255,0.18)), linear-gradient(90deg, rgba(255,255,255,0.18), rgba(255,255,255,0.18)),
      linear-gradient(rgba(255,255,255,0.07) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.07) 1px, transparent 1px);
    background-size: 100% 1px, 1px 100%, 100% 25%, 12.5% 100%; background-position: 0 50%, 50% 0, 0 0, 0 0; background-repeat: no-repeat, no-repeat, repeat, repeat; }
  #listen .glass { position: absolute; inset: 0; pointer-events: none; border-radius: 6px;
    background: linear-gradient(160deg, rgba(255,255,255,0.10) 0%, rgba(255,255,255,0.02) 35%, transparent 55%); }
  #listen .plate { height: 18px; display: flex; justify-content: space-between; align-items: center; padding: 0 3px; font: 600 10px var(--body); color: #9a9a9a; letter-spacing: 0.03em; }
  #listen .led { width: 7px; height: 7px; border-radius: 50%; background: #2a2a2a; box-shadow: inset 0 1px 1px rgba(0,0,0,0.8); transition: background 0.2s, box-shadow 0.2s; }
  #listen .led.on { background: #fff; box-shadow: 0 0 6px 1px rgba(255,255,255,0.8); }
  .kcol { display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; height: 100%; justify-content: center; }
  .kcol::before { content: ""; position: absolute; top: 0; left: 22%; right: 22%; height: 4px; background: var(--black); transform: scaleX(0); transition: transform 0.3s var(--ease); }
  .kcol.active::before { transform: scaleX(1); }
  .kcol .name { font-family: var(--display); font-weight: 800; font-size: 20px; line-height: 1; }
  .knob { width: 76px; height: 76px; border-radius: 50%; background: var(--black); position: relative; cursor: ns-resize; touch-action: none; }
  .knob svg { position: absolute; inset: 0; pointer-events: none; }
  .kcol .val { font-size: 11.5px; font-weight: 600; font-variant-numeric: tabular-nums; }

  @media (prefers-reduced-motion: reduce) { *, *::before { transition: none !important; } }

  html.plugin body { background: #000; place-items: start; }
  html.plugin #win { box-shadow: none; }
  #print { display: none; }
  @media print {
    @page { margin: 0.5in; }
    body { background: #fff; color: #000; display: block; overflow: visible; }
    #frame { display: none; }
    #print { display: block; font: 10.5pt/1.4 var(--body); color: #000; }
    #print h1 { font: 900 30pt/1 var(--display); margin: 0; }
    #print .sub { color: #444; margin: 4px 0 10px; }
    #print h2 { font: 800 15pt/1 var(--display); border-top: 1px solid #000; padding-top: 6px; margin: 12px 0 6px; }
    #print .it { display: grid; grid-template-columns: 1fr 110px; gap: 10px; margin-bottom: 6px; break-inside: avoid; }
    #print .w { text-align: right; } #print .o { color: #444; }
    #print ul { margin: 2px 0 0; padding-left: 16px; }
  }
</style>
</head>

    const states = ["fuzz", "tone", "level", "bias"].map(id => Juce.getSliderState(id));
    states.forEach((st, si) => {
      const sync = () => knobs[si].set(st.getNormalisedValue(), true, true);
      st.valueChangedEvent.addListener(sync); st.propertiesChangedEvent.addListener(sync); sync();
    });
    paramOut = (si, v) => states[si].setNormalisedValue(v);
    dragStart = si => states[si].sliderDragStarted();
    dragEnd = si => states[si].sliderDragEnded();
    const openURL = Juce.getNativeFunction("openURL"), openResume = Juce.getNativeFunction("openResume");
    document.addEventListener("click", e => { const a = e.target.closest("a[href]"); if (!a) return; e.preventDefault(); openURL(a.href); });
    document.getElementById("printBtn").onclick = () => openResume();
    window.__JUCE__.backend.addEventListener("scope", d => { pluginScope = d; });
  });
}

fit(); markUI(); frame();
</script>
</body>
