<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>CV Fuzz · still 3 · transfer curve</title>
<link rel="stylesheet" href="still.css">
<style>
  /* docs/media/transfer-curve.png (2000 x 840), redrawn at 3840 x 2160 from the formulas in
     Source/FuzzProcessor.h, in the same black-on-white style as the repository's plots. */
  body { background: var(--white); color: var(--black); }
  .head { position: absolute; left: 120px; top: 70px; right: 120px; }
  h1 { font: 900 96px/1 var(--display); margin: 0; }
  .sub { font: 30px/1.35 var(--body); color: #555; margin: 14px 0 0; }
  svg { position: absolute; left: 0; top: 250px; }
  svg text { font-family: var(--body); }
  .foot { background: var(--black); color: var(--white); height: 80px; }
  .foot b { font: 800 36px/1 var(--display); }
</style></head>
<body>
<div class="head">
  <h1>Transfer curve</h1>
  <!-- +0.70 / -0.46: FuzzProcessor.h asymmetricClip and negThresh. Bias offset 0.25 * bias^1.5 and
       negThresh = 0.46 * (1 - 0.85 * bias^1.5): FuzzProcessor.h setBias. Drive 1 + 60 * fuzz: processSample. -->
  <p class="sub">The clipper is asymmetric: it flattens at +0.70 on top and -0.46 below. Bias shifts the curve left<br>and collapses the bottom rail. Fuzz at its default 50%, so the drive is 31x.</p>
</div>
<svg id="plot" width="1920" height="750" viewBox="0 0 1920 750"></svg>
<div class="foot"><b>CV Fuzz</b><span>Static curve of the clipper, from Source/FuzzProcessor.h · Checo Cadena · 2026</span></div>
<script>
  // The same maths as FuzzProcessor.h, without the oversampling filters (they do not change the static shape).
  const fuzz = 0.5, drive = 1 + 60 * fuzz;   // default Fuzz (PluginProcessor.cpp) -> drive 31
  function out(x, bias) {
    const starve = Math.pow(bias, 1.5), off = 0.25 * starve, neg = 0.46 * (1 - 0.85 * starve);
    const v = (x + off) * drive;
    return v >= 0 ? Math.tanh(v / 0.70) * 0.70 : Math.tanh(v / neg) * neg;
  }
  const L = 210, R = 1800, T = 20, B = 640;           // plot box in px
  const X0 = -0.5, X1 = 0.5, Y0 = -0.5, Y1 = 0.75;
  const px = x => L + (x - X0) / (X1 - X0) * (R - L), py = y => B - (y - Y0) / (Y1 - Y0) * (B - T);
  let s = "";
  for (let g = -0.4; g <= 0.41; g += 0.2) s += `<line x1="${px(g)}" y1="${T}" x2="${px(g)}" y2="${B}" stroke="#e6e6e6" stroke-width="2"/>`;
  for (let g = -0.4; g <= 0.61; g += 0.2) s += `<line x1="${L}" y1="${py(g)}" x2="${R}" y2="${py(g)}" stroke="#e6e6e6" stroke-width="2"/>`;
  s += `<line x1="${px(0)}" y1="${T}" x2="${px(0)}" y2="${B}" stroke="#000" stroke-width="1.5"/>`;
  s += `<line x1="${L}" y1="${py(0)}" x2="${R}" y2="${py(0)}" stroke="#000" stroke-width="1.5"/>`;
  s += `<path d="M${L} ${T} V${B} H${R}" fill="none" stroke="#000" stroke-width="3"/>`;
  const fmt = v => (Math.abs(v) < 1e-9 ? "0.0" : v.toFixed(1)).replace("-", "−");
  for (let g = -0.4; g <= 0.41; g += 0.2) s += `<text x="${px(g)}" y="${B + 44}" font-size="28" text-anchor="middle">${fmt(g)}</text>`;
  for (let g = -0.4; g <= 0.61; g += 0.2) s += `<text x="${L - 18}" y="${py(g) + 10}" font-size="28" text-anchor="end">${fmt(g)}</text>`;
  s += `<text x="${(L + R) / 2}" y="${B + 96}" font-size="30" text-anchor="middle">Input</text>`;
  s += `<text transform="translate(${L - 120} ${(T + B) / 2}) rotate(-90)" font-size="30" text-anchor="middle">Output</text>`;
  const curves = [[0, "#000", "Bias 0%"], [0.5, "#666", "Bias 50%"], [1, "#aaa", "Bias 100%"]];
  curves.forEach(([b, c]) => {
    let d = "";
    for (let i = 0; i <= 2000; i++) { const x = X0 + (X1 - X0) * i / 2000; d += (i ? "L" : "M") + px(x).toFixed(1) + " " + py(out(x, b)).toFixed(1); }
    s += `<path d="${d}" fill="none" stroke="${c}" stroke-width="6" stroke-linejoin="round"/>`;
  });
  curves.forEach(([b, c, label], i) => {
    const y = py(-0.2) + i * 46;
    s += `<line x1="1500" y1="${y}" x2="1570" y2="${y}" stroke="${c}" stroke-width="6"/><text x="1590" y="${y + 10}" font-size="30">${label}</text>`;
  });
  document.getElementById("plot").innerHTML = s;
</script>
</body></html>
