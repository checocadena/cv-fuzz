<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>CV Fuzz · still 1 · the interface</title>
<link rel="stylesheet" href="still.css">
<style>
  /* The plugin's real interface: Source/ui/index.html from this repository, loaded unchanged and
     rendered at 1.6x, so the capture is 3200 px wide (docs/media/overview.png is 2000 px).
     In a browser the page shows the same interface as the plugin window (1000 x 620,
     Source/PluginEditor.cpp setSize) and opens on the Overview, with the knobs at their
     starting positions (index.html: makeKnob initial values). The page background is the
     interface's own browser background, #1e1e1e. */
  body { background: var(--page); }
  .win { position: absolute; left: 160px; top: 44px; width: 1000px; height: 620px; overflow: hidden;
    transform: scale(1.6); transform-origin: 0 0; box-shadow: 0 0 0 1px #444, 0 30px 80px rgba(0,0,0,0.6); }
  /* At 1040 x 660 the interface's fit() picks a scale of exactly 1 and centres the 1000 x 620 frame
     with a 20 px margin, which the offset below crops away. */
  iframe { position: absolute; left: -20px; top: -20px; width: 1040px; height: 660px; border: 0; }
</style></head>
<body>
<div class="win"><iframe src="../../Source/ui/index.html" scrolling="no" title="CV Fuzz interface"></iframe></div>
</body></html>
