<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" font-family="Schibsted Grotesk, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#000">
  <!-- CV Fuzz signal path, from Source/FuzzProcessor.h (processSample) and documentation/DSP.md.
       Drawn like the plugin's white knob deck: black knobs with a white pointer (Source/ui/index.html makeKnob).
       Inlined into proposal.html by build.py so it can use the web fonts. -->
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#000"/></marker>
    <g id="knob"><circle r="17" fill="#000"/><path d="M-11.3 8.5 A 14 14 0 1 1 11.3 8.5" fill="none" stroke="#555" stroke-width="2" stroke-linecap="round"/><line x1="0" y1="0" x2="-7" y2="-10" stroke="#fff" stroke-width="3" stroke-linecap="round"/></g>
  </defs>
  <rect width="1000" height="400" fill="#fff"/>

  <!-- 4x zone -->
  <rect x="506" y="78" width="484" height="116" fill="none" stroke="#000" stroke-width="1.5" stroke-dasharray="5 5"/>
  <text x="514" y="68" font-size="12" font-weight="600">RUNS AT 4X THE SAMPLE RATE</text>

  <g fill="#fff" stroke="#000" stroke-width="2">
    <rect x="18" y="92" width="136" height="88"/>
    <rect x="182" y="92" width="136" height="88"/>
    <rect x="346" y="92" width="136" height="88"/>
    <rect x="518" y="92" width="136" height="88"/>
    <rect x="682" y="92" width="136" height="88" stroke-width="4"/>
    <rect x="846" y="92" width="136" height="88"/>
    <rect x="18" y="278" width="136" height="88"/>
    <rect x="182" y="278" width="136" height="88"/>
    <rect x="346" y="278" width="136" height="88"/>
    <rect x="518" y="278" width="136" height="88" fill="#000"/>
  </g>

  <g text-anchor="middle">
    <text x="86" y="130" font-weight="700" font-size="16">Input</text>
    <text x="86" y="150" font-size="11.5" fill="#555">audio, one processor</text>
    <text x="86" y="165" font-size="11.5" fill="#555">per channel</text>

    <text x="250" y="122" font-weight="700" font-size="16">Bias offset</text>
    <text x="250" y="142" font-size="11.5" fill="#555">adds 0.25 × bias^1.5</text>
    <text x="250" y="157" font-size="11.5" fill="#555">before the drive,</text>
    <text x="250" y="172" font-size="11.5" fill="#555">like a starved transistor</text>

    <text x="414" y="130" font-weight="700" font-size="16">Drive</text>
    <text x="414" y="150" font-size="11.5" fill="#555">1x to 61x,</text>
    <text x="414" y="165" font-size="11.5" fill="#555">0 to +35.7 dB</text>

    <text x="586" y="130" font-weight="700" font-size="16">Upsample</text>
    <text x="586" y="150" font-size="11.5" fill="#555">zero-stuff, then</text>
    <text x="586" y="165" font-size="11.5" fill="#555">Butterworth lowpass</text>

    <text x="750" y="122" font-weight="700" font-size="16">Clipper</text>
    <text x="750" y="142" font-size="11.5" fill="#555">tanh, flattens at</text>
    <text x="750" y="157" font-size="11.5" fill="#555">+0.70 and −0.46;</text>
    <text x="750" y="172" font-size="11.5" fill="#555">Bias shrinks the −0.46</text>

    <text x="914" y="130" font-weight="700" font-size="16">Downsample</text>
    <text x="914" y="150" font-size="11.5" fill="#555">lowpass, then keep</text>
    <text x="914" y="165" font-size="11.5" fill="#555">1 sample in 4</text>

    <text x="86" y="316" font-weight="700" font-size="16">DC blocker</text>
    <text x="86" y="336" font-size="11.5" fill="#555">one-pole highpass,</text>
    <text x="86" y="351" font-size="11.5" fill="#555">about 38 Hz at 48 kHz</text>

    <text x="250" y="316" font-weight="700" font-size="16">Tone</text>
    <text x="250" y="336" font-size="11.5" fill="#555">dark to bright crossfade,</text>
    <text x="250" y="351" font-size="11.5" fill="#555">500 Hz to 6 kHz</text>

    <text x="414" y="316" font-weight="700" font-size="16">Level</text>
    <text x="414" y="336" font-size="11.5" fill="#555">output gain,</text>
    <text x="414" y="351" font-size="11.5" fill="#555">0 to 1</text>

    <text x="586" y="327" font-weight="700" font-size="16" fill="#fff">Output</text>
  </g>

  <!-- arrows -->
  <g stroke="#000" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M154 136 H180"/>
    <path d="M318 136 H344"/>
    <path d="M482 136 H516"/>
    <path d="M654 136 H680"/>
    <path d="M818 136 H844"/>
    <path d="M914 180 V214 H86 V276"/>
    <path d="M154 322 H180"/>
    <path d="M318 322 H344"/>
    <path d="M482 322 H516"/>
  </g>
  <!-- Bias also reaches the clipper's bottom rail -->
  <path d="M266 36 C 400 -6, 660 -2, 740 90" stroke="#000" stroke-width="1.5" fill="none" stroke-dasharray="3 4" marker-end="url(#a)"/>

  <!-- knobs, as on the plugin's deck -->
  <use href="#knob" x="250" y="48"/>
  <use href="#knob" x="414" y="48"/>
  <use href="#knob" x="250" y="244"/>
  <use href="#knob" x="414" y="244"/>
  <g font-family="Big Shoulders Display, Arial Narrow, sans-serif" font-weight="800" font-size="20">
    <text x="196" y="55" text-anchor="end">Bias</text>
    <text x="440" y="55">Fuzz</text>
    <text x="196" y="251" text-anchor="end">Tone</text>
    <text x="440" y="251">Level</text>
  </g>

  <g font-size="12" fill="#555">
    <text x="690" y="300">Each knob is a parameter from 0 to 1,</text>
    <text x="690" y="317">read once per audio block.</text>
    <text x="690" y="342">Dotted: Bias also lowers the clipper's</text>
    <text x="690" y="359">bottom rail, down to about 0.07.</text>
  </g>
</svg>
